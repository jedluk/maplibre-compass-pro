name: Release

# Publishes to npm whenever a version tag gets pushed:
#   npm version <patch|minor|major> && git push --follow-tags
on:
  push:
    tags: [ 'v*.*.*' ]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub release
      id-token: write # npm trusted publishing

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: pnpm/action-setup@v4
      with:
        version: 8
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'pnpm'
        registry-url: 'https://registry.npmjs.org'

    - name: Check tag matches package version
      run: |
        version="v$(node -p "require('./package.json').version")"
        if [ "$version" != "$GITHUB_REF_NAME" ]; then
          echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
          exit 1
        fi

    - name: Check tag belongs to main
      run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run prettier
      run: pnpm run lint:code

    - name: Run stylelint
      run: pnpm run lint:styles

    - name: Build package
      run: pnpm run build

    - name: Check committed types are up to date
      run: git diff --exit-code -- types

    # trusted publishing needs npm 11.5.1 or newer, Node 20 ships with npm 10
    - name: Update npm
      run: npm install -g npm@11

    - name: Publish
      run: npm publish --access public

    - name: Create GitHub release
      run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
      env:
        GH_TOKEN: ${{ github.token }}
